<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | BrasaBox</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">BB</span> BrasaBox</a><nav class="nav-links"><a href="index.html">Início</a><a class="active" href="cardapio.html">Cardápio</a><a href="promocoes.html">Promoções</a><a href="sobre.html">Sobre</a><a href="contato.html">Contato</a></nav><div class="nav-actions"><a class="icon-btn" href="perfil.html">👤</a><a class="icon-btn" href="carrinho.html">🛒<span class="cart-count">0</span></a><button class="icon-btn menu-toggle" type="button">☰</button></div></div></header><main><section class="product-detail"><div class="container"><div id="productDetail" class="detail-grid"></div></div></section></main><div class="toast"></div><script src="js/dados.js"></script><script src="js/script.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=Number(new URLSearchParams(location.search).get('id')),p=getProdutos().find(x=>x.id===id),el=document.querySelector('#productDetail');if(!p){el.innerHTML='<div class="empty" style="grid-column:1/-1"><h2>Produto não encontrado</h2><a class="btn btn-primary" href="cardapio.html">Voltar ao cardápio</a></div>';return}let qtd=1,total=p.precoPromocional||p.preco;let tam='Médio',adds=[];el.innerHTML=`<div class="detail-image">${productImage(p)}</div><div class="detail"><span class="eyebrow">${CATEGORIAS[p.categoria]}</span><h1>${p.nome}</h1><div class="rating">★★★★★ <span style="color:#777">${p.avaliacao.toFixed(1)}</span></div><p class="detail-description">${p.descricao}</p><h3>Ingredientes</h3><ul class="ingredients">${p.ingredientes.map(i=>`<li>${i}</li>`).join('')}</ul><div class="option-group"><div class="option-title">Tamanho</div><div class="options">${['Pequeno','Médio','Grande'].map((x,i)=>`<button type="button" class="option ${i===1?'selected':''}" data-size="${x}" data-extra="${i===0?0:i===1?2:4}">${x}${i?` + R$ ${i===1?'2,00':'4,00'}`:''}</button>`).join('')}</div></div><div class="option-group"><div class="option-title">Adicionais</div><div class="options">${[['Queijo',3],['Bacon',4],['Molho especial',2]].map(x=>`<button type="button" class="option" data-add="${x[0]}" data-extra="${x[1]}">${x[0]} + ${money(x[1])}</button>`).join('')}</div></div><div class="option-group"><div class="price" style="font-size:1.5rem"><strong id="detailPrice">${money(total+2)}</strong></div><div style="display:flex;gap:12px;align-items:center;margin-top:14px"><div class="qty"><button id="minus" type="button">−</button><span id="qty">1</span><button id="plus" type="button">+</button></div><button id="addDetail" class="btn btn-primary" type="button">Adicionar ao carrinho</button></div></div></div>`;const base=p.precoPromocional||p.preco;function calc(){total=base+(tam==='Pequeno'?0:tam==='Médio'?2:4)+adds.reduce((s,a)=>s+a.preco,0);document.querySelector('#detailPrice').textContent=money(total*qtd)}$$('.option[data-size]').forEach(b=>b.onclick=()=>{$$('.option[data-size]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');tam=b.dataset.size;calc()});$$('.option[data-add]').forEach(b=>b.onclick=()=>{const a={nome:b.dataset.add,preco:Number(b.dataset.extra)};const found=adds.find(x=>x.nome===a.nome);if(found){adds=adds.filter(x=>x.nome!==a.nome);b.classList.remove('selected')}else{adds.push(a);b.classList.add('selected')}calc()});$('#plus').onclick=()=>{qtd++;$('#qty').textContent=qtd;calc()};$('#minus').onclick=()=>{qtd=Math.max(1,qtd-1);$('#qty').textContent=qtd;calc()};$('#addDetail').onclick=()=>{addToCart(p.id,{quantidade:qtd,tamanho:tam,adicionais:adds});setTimeout(()=>location.href='carrinho.html',500)}})</script></body></html>
