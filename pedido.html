<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido | BrasaBox</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">BB</span> BrasaBox</a><nav class="nav-links"><a href="index.html">Início</a><a href="cardapio.html">Cardápio</a><a href="promocoes.html">Promoções</a><a href="sobre.html">Sobre</a><a href="contato.html">Contato</a></nav><div class="nav-actions"><a class="icon-btn" href="perfil.html">👤</a><a class="icon-btn" href="carrinho.html">🛒<span class="cart-count">0</span></a><button class="icon-btn menu-toggle" type="button">☰</button></div></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Finalização</span><h1>Seu pedido</h1><p>Preencha os dados e confirme a compra simulada.</p></div></section><section id="checkoutSection" class="section"><div class="container checkout-layout"><form id="checkoutForm" class="panel"><h2>Dados do pedido</h2><div class="form-grid"><div class="field"><label for="nome">Nome</label><input id="nome" class="input" required></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" class="input" required></div><div class="field full"><label for="endereco">Endereço</label><input id="endereco" class="input" required></div><div class="field"><label for="numero">Número</label><input id="numero" class="input" required></div><div class="field"><label for="complemento">Complemento</label><input id="complemento" class="input"></div><div class="field"><label for="bairro">Bairro</label><input id="bairro" class="input" required></div><div class="field"><label for="cidade">Cidade</label><input id="cidade" class="input" required></div><div class="field"><label for="cep">CEP</label><input id="cep" class="input" pattern="[0-9]{5}-?[0-9]{3}" placeholder="00000-000" required></div><div class="field full"><label>Forma de entrega</label><div class="radio-grid"><label class="radio-card"><input type="radio" name="entrega" value="Entrega" checked> Entrega</label><label class="radio-card"><input type="radio" name="entrega" value="Retirada"> Retirada no estabelecimento</label></div></div><div class="field full"><label>Forma de pagamento</label><div class="radio-grid"><label class="radio-card"><input type="radio" name="pagamento" value="Pix" checked> Pix</label><label class="radio-card"><input type="radio" name="pagamento" value="Cartão"> Cartão</label><label class="radio-card"><input type="radio" name="pagamento" value="Dinheiro"> Dinheiro</label></div></div><div class="full"><button class="btn btn-primary btn-block" type="submit">Confirmar pedido</button></div></div></form><aside class="panel"><h2>Resumo</h2><div id="checkoutItems"></div><div class="summary-row total"><span>Total</span><strong id="checkoutTotal">R$ 0,00</strong></div><p style="color:#777;font-size:.82rem">Pagamento e entrega são simulados para este projeto acadêmico.</p></aside></div></section><section id="orderConfirmation" class="section" style="display:none"><div class="container panel"><h2>Pedido confirmado!</h2></div></section><section class="section" id="confirmationFallback"><div class="container" id="confirmationContent"></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© <span data-current-year></span> BrasaBox.</span><span>Projeto fictício.</span></div></footer><div class="toast"></div><script src="js/dados.js"></script><script src="js/script.js"></script><script src="js/auth.js"></script><script src="js/carrinho.js"></script><script src="js/pedido.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const n=new URLSearchParams(location.search).get('numero');if(n){document.querySelector('#checkoutSection').style.display='none';const o=orders().find(x=>x.numero===n);if(o)document.querySelector('#confirmationContent').innerHTML=`<div class="panel"><span class="eyebrow">Pedido recebido</span><h2 style="font-family:Nunito;font-size:2rem">Tudo certo! Pedido <span style="color:var(--primary)">#${o.numero}</span></h2><p>Valor total: <strong>${money(o.total)}</strong> · Pagamento: <strong>${o.dados.pagamento}</strong></p><div class="status"><div class="status-step current"><div class="status-dot">✓</div><small>Recebido</small></div><div class="status-step"><div class="status-dot">2</div><small>Preparando</small></div><div class="status-step"><div class="status-dot">3</div><small>Saiu</small></div><div class="status-step"><div class="status-dot">4</div><small>Entregue</small></div></div><h3>Itens</h3><div>${o.itens.map(i=>`<div class="summary-row"><span>${i.quantidade}x ${i.nome}</span><strong>${money(i.preco*i.quantidade)}</strong></div>`).join('')}</div><a class="btn btn-primary" href="perfil.html" style="margin-top:15px">Ver meus pedidos</a><a class="btn btn-outline" href="index.html" style="margin-top:15px">Voltar ao início</a></div>`}})</script></body></html>
