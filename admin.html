<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | BrasaBox</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">BB</span> BrasaBox</a><nav class="nav-links"><a href="index.html">Início</a><a href="cardapio.html">Cardápio</a><a href="perfil.html">Perfil</a></nav><div class="nav-actions"><a class="icon-btn" href="carrinho.html">🛒<span class="cart-count">0</span></a><button class="icon-btn menu-toggle" type="button">☰</button></div></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Acesso administrativo</span><h1>Gerenciar produtos</h1><p>Cadastre, edite e remova produtos do catálogo.</p></div></section><section class="section"><div class="container"><div id="adminPanel" class="panel"><div class="admin-toolbar"><h2>Produtos cadastrados</h2><button id="newProduct" class="btn btn-primary">+ Cadastrar produto</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="adminRows"></tbody></table></div></div></div></section></main><div id="productModal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Produto</h2><button id="closeProductModal" class="modal-close" type="button">×</button></div><form id="productForm"><div class="form-grid"><div class="field full"><label for="pNome">Nome</label><input id="pNome" class="input" required></div><div class="field"><label for="pCategoria">Categoria</label><select id="pCategoria" class="select"><option value="hamburgueres">Hambúrgueres</option><option value="combos">Combos</option><option value="porcoes">Porções</option><option value="bebidas">Bebidas</option><option value="sobremesas">Sobremesas</option></select></div><div class="field"><label for="pImagem">Imagem/emoji</label><input id="pImagem" class="input" placeholder="🍔"></div><div class="field full"><label for="pDescricao">Descrição</label><textarea id="pDescricao" class="textarea" required></textarea></div><div class="field full"><label for="pIngredientes">Ingredientes separados por vírgula</label><input id="pIngredientes" class="input"></div><div class="field"><label for="pPreco">Preço</label><input id="pPreco" class="input" type="number" step="0.01" min="0" required></div><div class="field"><label for="pPromo">Preço promocional</label><input id="pPromo" class="input" type="number" step="0.01" min="0"></div><label class="radio-card full"><input id="pDisponivel" type="checkbox" checked> Produto disponível</label><div class="full"><button class="btn btn-primary btn-block" type="submit">Salvar produto</button></div></div></form></div></div><div class="toast"></div><script src="js/dados.js"></script><script src="js/script.js"></script><script src="js/auth.js"></script><script src="js/carrinho.js"></script><script src="js/pedido.js"></script><script src="js/admin.js"></script></body></html>
