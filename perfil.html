<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | BrasaBox</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">BB</span> BrasaBox</a><nav class="nav-links"><a href="index.html">Início</a><a href="cardapio.html">Cardápio</a><a href="promocoes.html">Promoções</a><a href="sobre.html">Sobre</a><a href="contato.html">Contato</a></nav><div class="nav-actions"><a class="icon-btn" href="carrinho.html">🛒<span class="cart-count">0</span></a><button class="icon-btn menu-toggle" type="button">☰</button></div></div></header><main><section class="page-hero"><div class="container"><span class="eyebrow">Minha conta</span><h1>Perfil</h1><p>Dados da conta e histórico de pedidos.</p></div></section><section class="section"><div class="container profile-layout"><aside class="panel profile-menu"><a class="active" href="perfil.html">👤 Meus dados</a><a href="#pedidos">📦 Meus pedidos</a><a href="admin.html" id="adminLink" hidden>⚙️ Área administrativa</a><a href="#" id="logout">↪ Sair</a></aside><div><div id="profileBox" class="panel"></div><div id="pedidos" class="panel" style="margin-top:20px"><h2>Histórico de pedidos</h2><div id="orderHistory"></div></div></div></div></section></main><footer class="footer"><div class="container footer-bottom"><span>© <span data-current-year></span> BrasaBox.</span><span>Projeto fictício.</span></div></footer><div class="toast"></div><script src="js/dados.js"></script><script src="js/script.js"></script><script src="js/auth.js"></script><script src="js/pedido.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=getUser();if(!u){location.href='login.html?redirect=perfil.html';return}document.querySelector('#profileBox').innerHTML=`<h2>${u.nome}</h2><p><strong>E-mail:</strong> ${u.email}</p><p><strong>Telefone:</strong> ${u.telefone||'Não informado'}</p>${u.admin?'<div class="notice success">Conta administrativa ativa.</div>':''}`;if(u.admin)document.querySelector('#adminLink').hidden=false;const os=orders();document.querySelector('#orderHistory').innerHTML=os.length?os.map(o=>`<div class="panel" style="padding:15px;margin:10px 0;background:#fff8ee"><div style="display:flex;justify-content:space-between;gap:10px"><strong>#${o.numero}</strong><strong>${money(o.total)}</strong></div><small>${new Date(o.data).toLocaleString('pt-BR')} · ${o.status}</small><div>${o.itens.map(i=>`<span>${i.quantidade}x ${i.nome}</span>`).join(' · ')}</div></div>`).join(''):'<p style="color:#777">Você ainda não realizou pedidos.</p>';document.querySelector('#logout').onclick=e=>{e.preventDefault();logout()}})</script></body></html>
